name: eplus-watch

on:
  schedule:
    # ※GitHubはUTCのため、日本時間から9時間引いた値で書いています（毎日・24時間）
    # 日本時間 10:00（監視＋「本日も監視します」通知）
    - cron: "0 1 * * *"
    # 日本時間 10:10〜10:50
    - cron: "10-50/10 1 * * *"
    # 日本時間 9:00〜9:50、11:00〜翌8:50（10:00台以外の全時間帯）
    - cron: "*/10 0,2-23 * * *"
  workflow_dispatch:

jobs:
  # 毎朝10時の「本日も監視します」通知（監視の順番待ちに巻き込まれないよう別ジョブ）
  morning:
    if: github.event.schedule == '0 1 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send morning message
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          pip install requests beautifulsoup4 playwright
          python -u eplus_check.py morning

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    # 実行中に次の自動実行が来たら、終わるまで待たせる（重複させない）
    concurrency:
      group: eplus-watch
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
    steps:
      - name: Stop after event day
        id: period
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 公演日（2026/12/20）になったら停止
          if [ "$(TZ=Asia/Tokyo date +%Y%m%d)" -ge 20261220 ]; then
            echo "公演日を迎えたため、このワークフローを停止します"
            gh workflow disable eplus-watch.yml --repo "$GITHUB_REPOSITORY"
            echo "ended=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.period.outputs.ended != 'true'
      - uses: actions/setup-python@v5
        if: steps.period.outputs.ended != 'true'
        with:
          python-version: "3.12"
      - name: Install
        if: steps.period.outputs.ended != 'true'
        run: |
          pip install playwright requests beautifulsoup4
          playwright install --with-deps chromium
      - name: Check
        if: steps.period.outputs.ended != 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -u eplus_check.py
