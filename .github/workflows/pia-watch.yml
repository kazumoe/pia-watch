name: pia-watch

on:
  schedule:
    # 日本時間 10:00〜17:50 を10分ごと（GitHubはUTCのため9時間引いた 1〜8時）
    - cron: "*/10 1-8 * * *"
    # 日本時間 18:00 の最終チェック
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install playwright requests
          playwright install --with-deps chromium
      - name: Check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python pia_check.py
